<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SRILALITHA Lakshmi Rice Shop &amp; General Stores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0f4d34;--g2:#1c7a52;--gold:#f6b91f;--gold2:#ff9d2e;--bg:#f6faf5;--card:rgba(255,255,255,.85);--solid:#fff;--ink:#12261c;--mute:#5b6e62;--line:rgba(15,77,52,.13);--red:#c0392b;--sh:0 10px 36px -14px rgba(15,77,52,.3);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b130e;--card:rgba(26,40,31,.85);--solid:#16231b;--ink:#eef6ef;--mute:#9db0a3;--line:rgba(255,255,255,.12);--sh:0 10px 36px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{--bg:#0b130e;--card:rgba(26,40,31,.85);--solid:#16231b;--ink:#eef6ef;--mute:#9db0a3;--line:rgba(255,255,255,.12);--sh:0 10px 36px -14px rgba(0,0,0,.7)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
nav{position:sticky;top:0;z-index:20;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
.logo{font-family:'Yeseva One',serif;font-size:19px;color:var(--g);display:flex;align-items:center;gap:8px;white-space:nowrap}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{color:var(--gold)}}
.logo i{font-style:normal;display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--gold),var(--gold2));font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font:inherit;font-weight:700;border:0;cursor:pointer;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#2a1a00;box-shadow:0 10px 22px -8px rgba(255,157,46,.7)}
.btn.s{background:var(--solid);color:var(--ink);border:1px solid var(--line)}
.btn.d{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:8px 15px;font-size:14px}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
.hero{padding:34px 0 18px;background:radial-gradient(800px 380px at 90% -20%,rgba(246,185,31,.35),transparent 60%),radial-gradient(600px 400px at -10% 20%,rgba(28,122,82,.28),transparent 60%)}
.pill{display:inline-flex;gap:8px;align-items:center;padding:6px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px}
.pill b{width:8px;height:8px;border-radius:50%;background:#2ecc71;box-shadow:0 0 0 4px rgba(46,204,113,.25)}
h1{font-family:'Yeseva One',serif;font-weight:400;font-size:clamp(34px,8vw,60px);line-height:1.05;margin:14px 0 10px}
h1 span{background:linear-gradient(135deg,var(--g2),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:'Yeseva One',serif;font-weight:400;font-size:28px;margin:0 0 6px}
.lead{color:var(--mute);margin:0 0 18px;max-width:50ch}
.search{width:100%;padding:14px 18px;border-radius:999px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:inherit;box-shadow:var(--sh)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px}
.chip{flex:none;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:12px 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.pic{aspect-ratio:1/1;display:grid;place-items:center;font-size:54px;position:relative;background-size:cover;background-position:center}
.off{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}
.oos{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-weight:800}
.info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.info b{font-size:15px;line-height:1.25}.info small{color:var(--mute)}
.pr{display:flex;align-items:baseline;gap:8px;margin:6px 0 10px}
.pr strong{font-size:19px}.pr s{color:var(--mute);font-size:13px}
.add{margin-top:auto;width:100%}
.qty{margin-top:auto;display:flex;align-items:center;justify-content:space-between;background:var(--g2);color:#fff;border-radius:999px;padding:4px}
.qty button{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:30px 0}
.bar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:720px;margin:0 auto;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border-radius:22px;padding:12px 14px 12px 20px;display:none;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 16px 36px -10px rgba(15,77,52,.7);z-index:30}
.bar.on{display:flex}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:inherit;margin:4px 0 12px}
label{font-weight:700;font-size:14px}
.visit{background:linear-gradient(135deg,var(--g),#0a3322);color:#fff;border-radius:26px;padding:26px 22px;margin:10px 0 130px}
.visit h2{color:var(--gold)}.visit p{margin:4px 0;color:#dbe9df}
.visit .row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.tiny{display:block;text-align:center;color:var(--mute);font-size:13px;padding:0 0 90px}
.pbox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--sh);margin:14px 0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.prow:last-child{border:0}
.th{width:54px;height:54px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:26px;background-size:cover;background-position:center}
.prow .n{flex:1;min-width:0}.prow .n b{display:block}.prow .n small{color:var(--mute)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sw{font-size:12px;font-weight:800;padding:5px 11px;border-radius:999px;border:0;cursor:pointer}
.sw.in{background:#d6f5e0;color:#0c5a2c}.sw.out{background:#fde0dc;color:#8d1d12}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{background:rgba(246,185,31,.18);border:1px solid rgba(246,185,31,.5);border-radius:14px;padding:10px 14px;font-size:14px;margin:12px 0}

.hg{display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
@media(max-width:820px){.hg{grid-template-columns:1fr}}
.hero{padding:40px 0 34px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.trust{display:flex;gap:22px;margin-top:26px;flex-wrap:wrap}.trust div{font-size:13px;color:var(--mute)}.trust b{display:block;font-size:22px;color:var(--ink)}
.collage{position:relative;height:340px;max-width:440px;margin:0 auto;width:100%}
.cimg{position:absolute;width:48%;aspect-ratio:1/1;border-radius:22px;background:#fff center/contain no-repeat;box-shadow:0 22px 40px -14px rgba(15,77,52,.55);border:4px solid #fff}
.c0{left:0;top:30px;transform:rotate(-7deg);animation:fl 7s ease-in-out infinite}
.c1{right:0;top:0;transform:rotate(6deg);width:52%;animation:fl 8s ease-in-out -2s infinite;z-index:2}
.c2{left:22%;bottom:0;transform:rotate(-2deg);animation:fl 6s ease-in-out -4s infinite;z-index:3}
@keyframes fl{50%{translate:0 -10px}}
@media(prefers-reduced-motion:reduce){.cimg{animation:none}}
.perks{display:flex;gap:10px;overflow-x:auto;padding:0 18px 6px;max-width:1040px;margin:0 auto}
.perks span{flex:none;padding:10px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;box-shadow:var(--sh)}
section.blk{padding:34px 0 6px}
.steps,.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:14px}
.stp{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--sh)}
.stp i{font-style:normal;display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));font-weight:800;color:#2a1a00;margin-bottom:10px}
.stp p{margin:4px 0 0;color:var(--mute);font-size:15px}
.band{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border-radius:28px;padding:26px 22px;margin:34px 0 0;position:relative;overflow:hidden}
.band h2{color:var(--gold)}.band p{color:#dbe9df;margin:0;max-width:52ch}
.band:after{content:"\1F33E";position:absolute;right:-8px;bottom:-34px;font-size:150px;opacity:.14}
.stars{color:var(--gold2);letter-spacing:2px}
code{background:var(--line);padding:2px 6px;border-radius:6px;font-size:13px;word-break:break-all}
</style>
</head>

function picStyle(p){return p.img?"background:#fff url("+p.img+") center/contain no-repeat":"background:"+(GRAD[p.cat]||GRAD.Other)}
function route(){window.scrollTo(0,0);location.hash==="#partner"?partner():shop()}
window.addEventListener("hashchange",route);

/* ---------- CUSTOMER ---------- */
function go(){var e=$("shopnow");if(e)e.scrollIntoView({behavior:"smooth"})}
function shop(){var s=S.settings,im=S.products.filter(function(p){return p.img}).slice(0,3),col="";
 im.forEach(function(p,i){col+='<div class="cimg c'+i+'" style="background-image:url('+p.img+')" role="img" aria-label="'+esc(p.name)+'"></div>'});
 $("app").innerHTML='<nav><div class="wrap"><a class="logo" href="#"><i>\uD83C\uDF3E</i>SRILALITHA</a>'+
 '<a class="btn p sm" href="'+esc(s.maps)+'" target="_blank" rel="noopener">Directions</a></div></nav>'+
 '<header class="hero"><div class="wrap hg"><div><span class="pill"><b></b>Open today &middot; fresh stock in</span>'+
 '<h1>Premium rice.<br><span>Fair prices.</span><br>At your door.</h1><p class="lead">Genuine Sri Lalitha rice and everyday groceries from '+esc(s.name)+'. Build your order and send it on WhatsApp in a minute.</p>'+
 '<div class="cta"><button class="btn p" onclick="go()">Shop now</button><a class="btn s" href="'+esc(s.maps)+'" target="_blank" rel="noopener">\uD83D\uDCCD Find the shop</a></div>'+
 '<div class="trust"><div><b>Genuine</b>Sri Lalitha stock</div><div><b>5\u201326 kg</b>bag sizes</div><div><b>Same day</b>home delivery</div></div></div><div class="collage">'+col+'</div></div></header>'+
 '<div class="perks"><span>\uD83D\uDE9A Home delivery</span><span>\u2705 Genuine brand stock</span><span>\uD83D\uDCB0 Fair shop prices</span><span>\u2696\uFE0F Honest weight</span><span>\uD83D\uDCAC Order on WhatsApp</span></div>'+
 '<main class="wrap"><section class="blk" id="shopnow"><h2>Our products</h2><p class="lead" style="margin-bottom:12px">Tap Add, set quantity and send your list to the shop.</p>'+
 '<input class="search" id="q" placeholder="Search rice, dal, oil..." value="'+esc(q)+'" aria-label="Search products"><div class="chips" id="chips"></div><div class="grid" id="grid"></div></section>'+
 '<section class="blk"><h2>How it works</h2><div class="steps"><div class="stp"><i>1</i><b>Pick your items</b><p>Choose rice bags, dals, oil and more.</p></div><div class="stp"><i>2</i><b>Send on WhatsApp</b><p>Your list goes straight to the shop.</p></div><div class="stp"><i>3</i><b>Pickup or delivery</b><p>We pack it fresh and bring it over.</p></div></div></section>'+
 '<div class="band"><h2>Trusted Sri Lalitha rice</h2><p>From the 5 kg family pack to the full 26 kg bag, we keep the brand you know at a fair shop price.</p></div>'+
 '<section class="blk"><h2>Happy families</h2><div class="revs"><div class="stp"><span class="stars">\u2605\u2605\u2605\u2605\u2605</span><p>\u201CGood quality rice and the price is always fair.\u201D</p><small>Sample review</small></div><div class="stp"><span class="stars">\u2605\u2605\u2605\u2605\u2605</span><p>\u201COrdering on WhatsApp is so easy. Quick delivery.\u201D</p><small>Sample review</small></div><div class="stp"><span class="stars">\u2605\u2605\u2605\u2605\u2605</span><p>\u201CAll my kitchen needs in one shop.\u201D</p><small>Sample review</small></div></div></section>'+
 '<div class="visit" style="margin-top:34px"><h2>Visit the shop</h2><p>\uD83D\uDCCD '+esc(s.addr)+'</p><p>\uD83D\uDD52 '+esc(s.hours)+'</p>'+(s.phone?'<p>\uD83D\uDCDE '+esc(s.phone)+'</p>':'')+
 '<div class="row2"><a class="btn p" href="'+esc(s.maps)+'" target="_blank" rel="noopener">Open in Google Maps</a>'+(s.phone?'<a class="btn s" href="tel:'+esc(s.phone)+'">Call</a>':'')+'</div></div>'+
 '<a class="tiny" href="#partner">Shop partner login</a></main>'+
 '<div class="bar" id="bar"><div><b id="cnt"></b><br><small id="tot"></small></div><button class="btn p sm" onclick="checkout()">View order</button></div>';
 $("q").oninput=function(){q=this.value;grid()};
 chips();grid();bar()}
function chips(){var h="";["All"].concat(CATS).forEach(function(c){h+='<button class="chip" aria-pressed="'+(c===cat)+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'});
 $("chips").innerHTML=h;[].forEach.call($("chips").children,function(b){b.onclick=function(){cat=b.getAttribute("data-c");chips();grid()}})}
function grid(){var h="",t=q.trim().toLowerCase();
 S.products.forEach(function(p){if(cat!=="All"&&p.cat!==cat)return;if(t&&(p.name+" "+p.size).toLowerCase().indexOf(t)<0)return;
  var off=p.mrp>p.price?Math.round((p.mrp-p.price)/p.mrp*100):0,n=cart[p.id]||0;
  h+='<article class="card"><div class="pic" style="'+picStyle(p)+'">'+(p.img?"":EMO[p.cat]||"")+(off?'<span class="off">'+off+'% OFF</span>':"")+(p.stock?"":'<div class="oos">Out of stock</div>')+'</div>'+
  '<div class="info"><b>'+esc(p.name)+'</b><small>'+esc(p.size)+'</small><div class="pr"><strong>'+rs(p.price)+'</strong>'+(off?'<s>'+rs(p.mrp)+'</s>':"")+'</div>'+
  (!p.stock?'<button class="btn s sm add" disabled>Unavailable</button>':n?'<div class="qty"><button onclick="chg(\''+p.id+'\',-1)" aria-label="Remove one">&minus;</button><b>'+n+'</b><button onclick="chg(\''+p.id+'\',1)" aria-label="Add one">+</button></div>':'<button class="btn p sm add" onclick="chg(\''+p.id+'\',1)">Add</button>')+'</div></article>'});
 $("grid").innerHTML=h||'<div class="empty">No products found.</div>'}
function chg(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];grid();bar();if($("ov").classList.contains("on"))checkout()}
function total(){var n=0,t=0;for(var k in cart){var p=find(k);if(p){n+=cart[k];t+=cart[k]*p.price}}return[n,t]}
function bar(){var r=total();$("cnt").textContent=r[0]+(r[0]===1?" item":" items");$("tot").textContent="Total "+rs(r[1]);$("bar").classList.toggle("on",r[0]>0)}
function closeOv(){$("ov").classList.remove("on")}
$("ov").onclick=function(e){if(e.target===this)closeOv()};
function checkout(){var r=total();if(!r[0]){closeOv();return}
 var h='<h2>Your order</h2>';for(var k in cart){var p=find(k);if(p)h+='<div class="ln"><span>'+esc(p.name)+' <small>('+esc(p.size)+')</small><br><small>'+rs(p.price)+' each</small></span><span class="qty" style="min-width:110px;margin:0"><button onclick="chg(\''+k+'\',-1)">&minus;</button><b>'+cart[k]+'</b><button onclick="chg(\''+k+'\',1)">+</button></span></div>'}
 h+='<div class="ln"><b>Total</b><b>'+rs(r[1])+'</b></div><label for="cn">Your name</label><input id="cn" placeholder="Name"><label for="ca">Delivery address (optional)</label><textarea id="ca" rows="2" placeholder="House no, street, landmark"></textarea>'+
 '<button class="btn p" style="width:100%" onclick="sendWA()">Send order on WhatsApp</button><button class="btn s" style="width:100%;margin-top:8px" onclick="closeOv()">Keep shopping</button>';
 $("sheet").innerHTML=h;$("ov").classList.add("on")}
function sendWA(){var m="Hello "+S.settings.name+", I would like to order:\n",r=total();
 for(var k in cart){var p=find(k);if(p)m+="- "+p.name+" ("+p.size+") x "+cart[k]+" = "+rs(cart[k]*p.price)+"\n"}
 m+="Total: "+rs(r[1]);var n=$("cn").value.trim(),a=$("ca").value.trim();if(n)m+="\nName: "+n;if(a)m+="\nAddress: "+a;
 window.open("https://wa.me/"+S.settings.wa.replace(/\D/g,"")+"?text="+encodeURIComponent(m),"_blank")}

/* ---------- PARTNER (retailer) ---------- */
function partner(){
 if(!authed){$("app").innerHTML='<nav><div class="wrap"><a class="logo" href="#"><i>\uD83C\uDF3E</i>Partner</a></div></nav><main class="wrap"><div class="pbox" style="max-width:420px;margin:40px auto"><h2>Shop partner login</h2><p class="lead">Enter your PIN to manage products.</p><label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="btn p" style="width:100%" onclick="login()">Log in</button><p class="tiny" style="padding:12px 0 0">Demo PIN: 1234</p></div></main>';return}
 var tabs=[["products","Products"],["form",editId?"Edit product":"Add product"],["shop","Shop details"],["backup","Backup"]],h='<nav><div class="wrap"><a class="logo" href="#"><i>\uD83C\uDF3E</i>Partner</a><span><a class="btn s sm" href="#">View shop</a> <button class="btn d sm" onclick="authed=false;partner()">Log out</button></span></div></nav><main class="wrap"><div class="tabs">';
 tabs.forEach(function(t){h+='<button class="chip" aria-pressed="'+(ptab===t[0])+'" onclick="ptab=\''+t[0]+'\';if(ptab!==\'form\')editId=null;pendImg=null;partner()">'+t[1]+'</button>'});
 h+='</div>';
 if(ptab==="products"){h+='<div class="pbox"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+S.products.length+' products</b><button class="btn p sm" onclick="editId=null;pendImg=null;ptab=\'form\';partner()">+ Add product</button></div>';
  S.products.forEach(function(p){h+='<div class="prow"><div class="th" style="'+picStyle(p)+'">'+(p.img?"":EMO[p.cat]||"")+'</div><div class="n"><b>'+esc(p.name)+'</b><small>'+esc(p.size)+' &middot; '+rs(p.price)+'</small></div><div class="acts"><button class="sw '+(p.stock?"in":"out")+'" onclick="togg(\''+p.id+'\')">'+(p.stock?"In stock":"Out of stock")+'</button><button class="btn s sm" onclick="editId=\''+p.id+'\';pendImg=null;ptab=\'form\';partner()">Edit</button><button class="btn d sm" onclick="delp(\''+p.id+'\')">Delete</button></div></div>'});
  h+='</div>'}
 if(ptab==="form"){var p=editId?find(editId):{name:"",cat:"Rice",size:"",price:"",mrp:"",stock:true,img:""};
  h+='<div class="pbox"><h2>'+(editId?"Edit product":"Add product")+'</h2><label for="f_name">Product name</label><input id="f_name" value="'+esc(p.name)+'" placeholder="e.g. Sri Lalitha Raw Sonamasuri Rice">'+
  '<div class="two"><div><label for="f_cat">Category</label><select id="f_cat">'+CATS.map(function(c){return'<option'+(c===p.cat?" selected":"")+'>'+esc(c)+'</option>'}).join("")+'</select></div><div><label for="f_size">Size / pack</label><input id="f_size" value="'+esc(p.size)+'" placeholder="26 kg bag"></div></div>'+
  '<div class="two"><div><label for="f_price">Selling price (\u20B9)</label><input id="f_price" type="number" inputmode="numeric" value="'+esc(p.price)+'"></div><div><label for="f_mrp">MRP (\u20B9, optional)</label><input id="f_mrp" type="number" inputmode="numeric" value="'+esc(p.mrp||"")+'"></div></div>'+
  '<label for="f_img">Photo (optional)</label><input id="f_img" type="file" accept="image/*"><div class="th" id="pv" style="width:90px;height:90px;margin-bottom:12px;'+picStyle(p)+'">'+(p.img?"":EMO[p.cat]||"")+'</div>'+
  '<label><input id="f_stock" type="checkbox" style="width:auto;margin-right:8px"'+(p.stock?" checked":"")+'>Available in stock</label>'+
  '<button class="btn p" style="width:100%;margin-top:10px" onclick="saveP()">'+(editId?"Save changes":"Add to shop")+'</button></div>'}
 if(ptab==="shop"){var s=S.settings;h+='<div class="pbox"><h2>Shop details</h2><label for="s_name">Shop name</label><input id="s_name" value="'+esc(s.name)+'"><label for="s_wa">WhatsApp number for orders (with country code)</label><input id="s_wa" value="'+esc(s.wa)+'" inputmode="numeric" placeholder="919876543210"><label for="s_phone">Call number</label><input id="s_phone" value="'+esc(s.phone)+'"><label for="s_addr">Address</label><textarea id="s_addr" rows="2">'+esc(s.addr)+'</textarea><label for="s_hours">Opening hours</label><input id="s_hours" value="'+esc(s.hours)+'"><label for="s_maps">Google Maps link</label><input id="s_maps" value="'+esc(s.maps)+'"><label for="s_pin">Partner PIN</label><input id="s_pin" value="'+esc(s.pin)+'"><button class="btn p" style="width:100%" onclick="saveS()">Save details</button></div>'}
 if(ptab==="backup"){var base=location.href.split("#")[0];h+='<div class="pbox"><h2>Links</h2><p>Customer link (put this in Google Maps):<br><code>'+esc(base)+'</code></p><p>Partner link:<br><code>'+esc(base)+'#partner</code></p></div><div class="pbox"><h2>Backup</h2><div class="note">Products are saved in this phone\u2019s browser. To use them on another device, export here and import there.</div><button class="btn p" onclick="exp()">Export backup</button> <label class="btn s" style="margin-top:8px">Import backup<input type="file" accept="application/json" id="imp" style="display:none"></label> <button class="btn d" onclick="resetD()">Reset demo data</button></div>'}
 $("app").innerHTML=h+'</main>';
 if($("f_img"))$("f_img").onchange=function(){var f=this.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=480,sc=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*sc;c.height=im.height*sc;c.getContext("2d").drawImage(im,0,0,c.width,c.height);pendImg=c.toDataURL("image/jpeg",.72);$("pv").style.backgroundImage="url("+pendImg+")";$("pv").textContent=""};im.src=fr.result};fr.readAsDataURL(f)};
 if($("imp"))$("imp").onchange=function(){var f=this.files[0];if(!f)return;var fr=new FileReader();fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d.products||!d.settings)throw 0;S=d;save();alert("Backup imported");partner()}catch(e){alert("That file is not a valid backup")}};fr.readAsText(f)}}
function login(){if($("pin").value===S.settings.pin){authed=true;partner()}else alert("Wrong PIN")}
function togg(id){var p=find(id);p.stock=!p.stock;save();partner()}
function delp(id){if(confirm("Delete this product?")){S.products=S.products.filter(function(p){return p.id!==id});delete cart[id];save();partner()}}
function saveP(){var n=$("f_name").value.trim(),pr=Number($("f_price").value);if(!n||!(pr>0)){alert("Enter a product name and a selling price");return}
 var o={name:n,cat:$("f_cat").value,size:$("f_size").value.trim(),price:pr,mrp:Number($("f_mrp").value)||0,stock:$("f_stock").checked};
 if(editId){var p=find(editId);for(var k in o)p[k]=o[k];if(pendImg)p.img=pendImg}else{o.id="p"+Date.now();o.img=pendImg||"";S.products.unshift(o)}
 if(save()){editId=null;pendImg=null;ptab="products";partner()}}
function saveS(){var s=S.settings;["name","wa","phone","addr","hours","maps","pin"].forEach(function(k){s[k]=$("s_"+k).value.trim()});if(!s.pin)s.pin="1234";if(save())alert("Saved")}
function exp(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:"application/json"}));a.download="srilalitha-backup.json";a.click()}
function resetD(){if(confirm("Reset everything to demo data?")){S=seed();save();partner()}}
route();
</script>
</body>
</html>
